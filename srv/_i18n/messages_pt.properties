# Mensagens da aplicação Mensagens de clientes (Português)

# Formato dos valores introduzidos
ID_FORMAT=Utilize apenas letras, dígitos, pontos, hífenes e sublinhados, e comece com uma letra ou um dígito.
SLUG_FORMAT=Utilize letras minúsculas e dígitos separados por hífenes simples, por exemplo "reparacao-urgente".
MODEL_NAME_FORMAT=Utilize apenas letras, dígitos, pontos, hífenes e sublinhados, por exemplo "gpt-4o".

# Mensagens de clientes
MESSAGE_ID_NOT_UNIQUE=Já existe uma mensagem de cliente com o ID {0}.
TAG_DUPLICATE=A etiqueta "{0}" está atribuída mais do que uma vez.
MESSAGE_NOT_FOUND=A mensagem de cliente não existe.
MESSAGE_ALREADY_RESOLVED=A mensagem de cliente {0} já está resolvida.
MESSAGE_RESOLVED=A mensagem de cliente {0} foi marcada como resolvida.
REPLY_TO_RESOLVED_MESSAGE=A mensagem de cliente {0} já está resolvida. A resposta foi adicionada na mesma.
GRAPHQL_READ_ONLY=As mensagens de clientes podem ser lidas com GraphQL, mas não alteradas. Crie-as e edite-as com o serviço OData, que utiliza rascunhos.
SERVICE_ORDERS_UNAVAILABLE=As ordens de serviço não podem ser lidas de momento porque o sistema SAP S/4HANA não está disponível.

# Anexos
ATTACHMENT_TYPE_NOT_ALLOWED=Os ficheiros do tipo "{0}" não são permitidos. Tipos permitidos: {1}.
ATTACHMENT_TOO_LARGE=O ficheiro é demasiado grande. O tamanho máximo é {0} MB.
