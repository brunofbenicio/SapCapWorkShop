# Meldungen der Anwendung Kundennachrichten (Deutsch)

# Format von Eingabewerten
ID_FORMAT=Verwenden Sie nur Buchstaben, Ziffern, Punkte, Bindestriche und Unterstriche und beginnen Sie mit einem Buchstaben oder einer Ziffer.
SLUG_FORMAT=Verwenden Sie Kleinbuchstaben und Ziffern, getrennt durch einzelne Bindestriche, zum Beispiel "dringende-reparatur".
MODEL_NAME_FORMAT=Verwenden Sie nur Buchstaben, Ziffern, Punkte, Bindestriche und Unterstriche, zum Beispiel "gpt-4o".

# Kundennachrichten
MESSAGE_ID_NOT_UNIQUE=Eine Kundennachricht mit der ID {0} existiert bereits.
TAG_DUPLICATE=Der Tag "{0}" ist mehrfach zugeordnet.
MESSAGE_NOT_FOUND=Die Kundennachricht existiert nicht.
MESSAGE_ALREADY_RESOLVED=Kundennachricht {0} ist bereits gelöst.
MESSAGE_RESOLVED=Kundennachricht {0} wurde als gelöst markiert.
REPLY_TO_RESOLVED_MESSAGE=Kundennachricht {0} ist bereits gelöst. Die Antwort wurde trotzdem hinzugefügt.

# Anhänge
ATTACHMENT_TYPE_NOT_ALLOWED=Dateien vom Typ "{0}" sind nicht erlaubt. Erlaubte Typen: {1}.
ATTACHMENT_TOO_LARGE=Die Datei ist zu groß. Die maximale Größe beträgt {0} MB.
