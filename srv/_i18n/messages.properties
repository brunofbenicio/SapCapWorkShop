# Messages of the Customer Messages application (default language: English)

# Format of input values
ID_FORMAT=Use only letters, digits, dots, hyphens and underscores, and start with a letter or digit.
SLUG_FORMAT=Use lowercase letters and digits separated by single hyphens, for example "urgent-repair".
MODEL_NAME_FORMAT=Use only letters, digits, dots, hyphens and underscores, for example "gpt-4o".

# Customer messages
MESSAGE_ID_NOT_UNIQUE=A customer message with the ID {0} already exists.
TAG_DUPLICATE=The tag "{0}" is assigned more than once.
MESSAGE_NOT_FOUND=The customer message does not exist.
MESSAGE_ALREADY_RESOLVED=Customer message {0} is already resolved.
MESSAGE_RESOLVED=Customer message {0} was marked as resolved.
REPLY_TO_RESOLVED_MESSAGE=Customer message {0} is already resolved. The reply was added anyway.
GRAPHQL_READ_ONLY=Customer messages can be read with GraphQL, but not changed. Create and edit them with the OData service, which uses drafts.

# Attachments
ATTACHMENT_TYPE_NOT_ALLOWED=Files of type "{0}" are not allowed. Allowed types: {1}.
ATTACHMENT_TOO_LARGE=The file is too large. The maximum size is {0} MB.
